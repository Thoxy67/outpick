# CI on Forgejo (Linux runner, jobs in Docker, as term's .forgejo/workflows/ci.yml): check,
# clippy and host tests, then the real TV build (webOS NDK + SDL-webOS, size-optimised, size
# limit) and its .ipk (kept as an artifact), so a broken cross build shows up before a tag does.
#
# Runner label: repository variable FORGEJO_RUNNER (default "docker").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  tv:
    runs-on: ${{ vars.FORGEJO_RUNNER || 'docker' }}
    # Node for the JavaScript actions and the SDK scripts; Rust comes from rustup below
    # (the pinned nightly in rust-toolchain.toml).
    container:
      image: node:22-bookworm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends build-essential pkg-config git curl ca-certificates \
            python3 file xz-utils bzip2
      - name: Rust (pinned nightly from rust-toolchain.toml)
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: forgejo-tv-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'tools/setup-webos-sdk.mjs', 'tools/webos-runtime.mjs') }}
          restore-keys: forgejo-tv-
      - name: webOS SDK and SDL-webOS (pinned, cached)
        run: node tools/setup-webos-sdk.mjs && node tools/webos-runtime.mjs
      # The desktop preview (default features) needs no system libraries to check: its
      # windowing crates load libwayland/libX11/libGL at run time.
      - name: Check (desktop preview)
        run: cargo check --locked
      - name: Clippy (host, no UI backend)
        run: cargo clippy --no-default-features --locked -- -D warnings
      - name: Tests (host, no UI backend)
        run: cargo test --no-default-features --locked
      - name: TV build (armv7 soft-float, Thumb-2, size-optimised)
        run: tools/build-webos.sh --locked
      - name: TV binary size (limit 2 300 000 bytes)
        run: |
          bin=target/armv7-unknown-linux-gnueabi/release/outpick
          size="$(stat -c %s "$bin")"; limit=2300000
          echo "TV binary: $size bytes (limit $limit)" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          [ "$size" -le "$limit" ] || { echo "::error::$bin is $size bytes, over $limit"; exit 1; }
      - name: Package
        run: |
          python3 tools/package.py
          ls -l target/armv7-unknown-linux-gnueabi/release/outpick dist/
      - name: Package is reproducible (twice, same sha256)
        run: |
          git config --global --add safe.directory "$PWD"
          a="$(python3 tools/package.py | head -1)"; h1="$(sha256sum "$a" | cut -d' ' -f1)"
          sleep 2
          b="$(python3 tools/package.py | head -1)"; h2="$(sha256sum "$b" | cut -d' ' -f1)"
          echo "$h1  $a"; echo "$h2  $b"
          [ "$h1" = "$h2" ] || { echo "::error::tools/package.py is not reproducible"; exit 1; }
      - name: Release notes since the last tag (preview)
        run: tools/release/changelog.py
      # Forgejo's artifact server speaks the v3 protocol: its own fork of upload-artifact.
      - name: Upload the .ipk
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: outpick-ipk
          path: dist/*.ipk
          if-no-files-found: error
