<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Inlet #2: HDMI port profile whose signal flows as an arrow into a screen -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F1F22"/>
      <stop offset="1" stop-color="#141415"/>
    </linearGradient>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M134 346V292Q134 222 204 222H318" fill="none" stroke="#000" stroke-width="60" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#28282C" stroke-width="6"/>
  <!-- screen (Lucide monitor proportions) -->
  <g fill="none" stroke="#ECECF0" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <rect x="176" y="104" width="272" height="232" rx="32" fill="#1A1A1C" mask="url(#cut)"/>
    <path d="M312 336v52M256 392h112"/>
  </g>
  <!-- HDMI port, front profile -->
  <path d="M66 362H202V390L184 418H84L66 390Z" fill="#8B7CF6" fill-opacity="0.18" stroke="#8B7CF6" stroke-width="20" stroke-linejoin="round"/>
  <!-- flow arrow -->
  <g fill="none" stroke="#8B7CF6" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M134 340V292Q134 222 204 222H330"/>
    <path d="M290 182l40 40-40 40"/>
  </g>
</svg>
