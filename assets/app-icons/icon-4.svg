<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Inlet #4: TV silhouette with the floating source panel at the bottom of the screen -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F1F22"/>
      <stop offset="1" stop-color="#141415"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="256" cy="150" r="230">
      <stop offset="0" stop-color="#8B7CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B7CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#28282C" stroke-width="6"/>
  <!-- TV -->
  <rect x="56" y="100" width="400" height="260" rx="30" fill="#0F0F11"/>
  <rect x="56" y="100" width="400" height="260" rx="30" fill="url(#glow)"/>
  <rect x="56" y="100" width="400" height="260" rx="30" fill="none" stroke="#ECECF0" stroke-width="18"/>
  <path d="M256 360v40M184 410h144" fill="none" stroke="#ECECF0" stroke-width="18" stroke-linecap="round"/>
  <!-- source panel -->
  <rect x="94" y="252" width="324" height="76" rx="20" fill="#1A1A1C" stroke="#28282C" stroke-width="4"/>
  <g fill="#2E2E33">
    <rect x="110" y="268" width="62" height="44" rx="12"/>
    <rect x="264" y="268" width="62" height="44" rx="12"/>
    <rect x="340" y="268" width="62" height="44" rx="12"/>
  </g>
  <rect x="187" y="268" width="62" height="44" rx="12" fill="#8B7CF6" fill-opacity="0.3"/>
  <rect x="180" y="261" width="76" height="58" rx="17" fill="none" stroke="#8B7CF6" stroke-width="9"/>
</svg>
