[package]
name = "lg-c1-source"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
description = "A modern, customizable native source/input picker overlay for rooted LG webOS TVs"

[[bin]]
name = "source-picker"
path = "src/main.rs"

[features]
default = ["desktop"]
# Desktop preview window with mock inputs (for designing the UI on a PC).
desktop = ["dep:eframe", "dep:png"]
# The real TV build: SDL-webOS + GLES2 + luna-service2.
webos = ["dep:sdl2", "dep:glow", "dep:egui_glow"]

[dependencies]
# No default fonts: the UI ships a subset of Inter (tools/subset-fonts.sh).
egui = { version = "0.37", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
sdl2 = { version = "0.38", optional = true, features = ["use-pkgconfig"] }
libc = "0.2"
png = { version = "0.18", optional = true }
glow = { version = "0.17", optional = true }
egui_glow = { version = "0.37", optional = true, default-features = false }

[build-dependencies]
# Icons are rasterized at build time (build.rs): no SVG renderer in the binary.
resvg = { version = "0.45", default-features = false }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
